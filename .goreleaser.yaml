version: 2

builds:
  - main: ./cmd/miscale
    binary: miscale
    # CoreBluetooth needs cgo, so only darwin builds
    env:
      - CGO_ENABLED=1
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -linkmode external -extldflags '-sectcreate __TEXT __info_plist cmd/miscale/Info.plist'

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
